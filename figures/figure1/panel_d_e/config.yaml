# Panels 1d + 1e pipeline config. Path values here must match the
# equivalent entries in `quetzal_code/paths.yaml`.
paths:
  gencode_granges:    "../../../inputs/gencode_v46_granges.RDS"
  tcga_metadata:      "../../../inputs/tcga_v2_samples.tsv"
  gtex_metadata:      "../../../inputs/gtexv2_metadata.tsv"
  mane_transcripts:   "../../../inputs/MANE.GRCh38.v1.4.summary.txt"
  gtex_dat_dir:       "../../../leafcutter_analyses/junction_tables_gtex/"
  # holds chr*/{gene}/{res,de_res,results,dat}
  tcga_chr_dir:       "../../../quetzal_runs/gene_level"
  psi_dir:            "../../../leafcutter_analyses/psi_files/"
  leaf2_class:        "../../../leafcutter_analyses/leaf2_classification/clustering/Leaf2_junction_classifications.txt"
  tcga_bw_dir:        "../../../inputs/bigwigs/tcga"
  gtex_bw_dir:        "../../../inputs/bigwigs/gtex"
  # GenometracksByGenotype clone (github.com/bfairkun/GenometracksByGenotype); edit to your clone
  pygenome_aggregator: "~/software/GenometracksByGenotype/AggregateBigwigsForPlotting.py"
  pygenome_bed12:      "~/software/GenometracksByGenotype/PremadeTracks/gencode.v26.FromGTEx.genes.bed12.gz"
  # Filtered to just the EZH2_LAML + NF1_LUSC rows so snakemake only
  # builds those two samples.
  cosmic_sig_tsv:     "../../../gene_level_analysis/gene_level_poisson_sig_results.tsv"
  cosmic_tier1_tsv:   "../../../inputs/cosmic_tier_1.tsv"

# DE-junction filters
thresholds:
  lfc_thresh:  2
  abs_thresh:  0.01
  sval_thresh: 0.05

# Extra named regions per sample (sample name = "{gene}_{cancer_short}").
# These are produced in addition to the auto-computed "default" region.
extra_regions:
  NF1_LUSC:
    narrow: "chr17:31248000-31259000"
