# Panel 1c pipeline config. Path values here must match the equivalent
# entries in `quetzal_code/paths.yaml` (users updating paths.yaml for
# their environment should update these too -- the pipeline reads its
# own config, not paths.yaml).
paths:
  gencode_granges:     "../../../inputs/gencode_v46_granges.RDS"
  tcga_metadata:       "../../../inputs/tcga_v2_samples.tsv"
  mane_transcripts:    "../../../inputs/MANE.GRCh38.v1.4.summary.txt"
  # holds chr*/{gene}/{res,de_res,results,dat}
  tcga_chr_dir:        "../../../quetzal_runs/gene_level"
  tcga_bw_dir:         "../../../inputs/bigwigs/tcga"
  leaf2_class:         "../../../leafcutter_analyses/leaf2_classification/clustering/Leaf2_junction_classifications.txt"
  # GenometracksByGenotype clone (github.com/bfairkun/GenometracksByGenotype); edit to your clone
  pygenome_aggregator: "~/software/GenometracksByGenotype/AggregateBigwigsForPlotting.py"
  pygenome_bed12:      "~/software/GenometracksByGenotype/PremadeTracks/gencode.v26.FromGTEx.genes.bed12.gz"

# DE-junction filters
thresholds:
  lfc_thresh:  2
  abs_thresh:  0.01
  sval_thresh: 0.05

# One entry per (gene, factor) showcase.
# Sample name = the YAML key. Outputs go under output/{sample_name}/.
# cohorts: TCGA cohort IDs (full "TCGA-XXXX") to include in the structure plot
#          and pygenome tracks. Structure-plot labels strip the "TCGA-" prefix.
# regions: named region -> "chr:start-end" string (or "" for auto-compute).
#          A "default" region is always rendered.
showcase:
  BDH1_k4:
    gene:    BDH1
    chr:     chr3
    factor:  k4
    cohorts:
      - TCGA-LIHC
      - TCGA-SKCM
      - TCGA-LGG
      - TCGA-COAD
      - TCGA-UVM
    regions:
      default: ""
